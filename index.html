<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="google-site-verification" content="TiZFfxi6KWBYBANfvoGGcSJErQu2JKVt8MiRKEJCc9c" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONG-AIL4C — Association Ivoirienne de Lutte Contre le Changement Climatique et le Chômage</title>
<meta name="description" content="ONG AIL4C en Côte d'Ivoire : actions pour le climat, la protection de l'environnement, l'emploi vert des jeunes, la lutte contre les VBG et la santé reproductive.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,18..144,400;0,18..144,500;0,18..144,600;1,18..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#16412F;">Chargement du site…</div>

<script src="site-template.js"></script>
<script>
  fetch('content.json?v=' + Date.now())
    .then(r => r.json())
    .then(data => {
      const app = document.getElementById('app');
      app.removeAttribute('style');
      app.innerHTML = AIL4C.renderApp(data);
      document.title = data.meta.title;
      const metaDesc = document.querySelector('meta[name="description"]');
      if(metaDesc) metaDesc.setAttribute('content', data.meta.description);
      const favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.href = data.images.logo;
      document.head.appendChild(favicon);
      AIL4C.initInteractions(document);
    })
    .catch(err => {
      document.getElementById('app').innerHTML =
        '<p style="padding:40px;font-family:sans-serif;color:#A6472A;">Impossible de charger content.json — vérifiez que ce fichier est bien présent dans le même dossier que index.html sur votre hébergement.</p>';
      console.error(err);
    });
</script>
</body>
</html>
